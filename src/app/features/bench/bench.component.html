<main id="bench" class="mx-auto min-w-90 max-w-7xl px-5 py-8 sm:px-8 sm:py-12 lg:px-10 lg:py-14">
  <header class="mb-9 flex flex-wrap items-center justify-between gap-5">
    <div class="flex items-center gap-3">
      <app-icon name="aperture" class="size-8 text-accent" />
      <h1 class="text-2xl font-medium tracking-tight">
        Spotlight<span class="sr-only"> HDR image encoder</span>
      </h1>
      <span class="ml-2 hidden border-l border-line pl-4 text-s text-muted sm:block"
        >HDR image studio</span
      >
    </div>
    <div class="flex items-center gap-5">
      <app-display-indicator />
      <button type="button" class="quiet-button text-[11px]" (click)="encoder.downloadProfile()">
        <app-icon name="download" class="size-3.5" /><span>ICC profile</span>
      </button>
    </div>
  </header>
  <section
    class="overflow-hidden rounded-2xl border border-line bg-surface shadow-2xl shadow-black/15"
    aria-label="HDR encoding workspace"
  >
    <div class="grid lg:grid-cols-[minmax(0,1fr)_400px]">
      <div class="min-w-0 p-5 sm:p-7">
        <app-source-upload
          [filename]="store.source()?.name ?? ''"
          [loading]="store.loading()"
          (selected)="store.load($event)"
        />
        <div class="mt-7">
          <app-image-comparison
            [source]="store.source()"
            [result]="store.result()"
            [busy]="store.encoding()"
          />
        </div>
        <app-export-results [result]="store.result()" />
      </div>
      <aside class="border-t border-line bg-panel/40 p-5 sm:p-7 lg:border-t-0 lg:border-l">
        <app-light-controls
          [settings]="store.settings()"
          [ready]="!!store.source() && !store.loading()"
          [busy]="store.encoding()"
          (changed)="store.update($event)"
          (resetRequested)="store.reset()"
          (encode)="store.encode()"
        />
        @if (store.error()) {
          <p
            role="alert"
            class="mt-4 rounded-lg border border-red-400/20 bg-red-400/5 p-3 text-xs leading-5 text-red-200"
          >
            {{ store.error() }}
          </p>
        }
      </aside>
    </div>
    <footer
      class="flex flex-wrap items-center justify-between gap-3 border-t border-line px-5 py-4 text-xs text-muted sm:px-7"
    >
      <div class="flex flex-wrap items-center gap-x-5 gap-y-2">
        <span class="mono">BT.2020</span><span class="h-3 w-px bg-line"></span
        ><span class="mono">PQ / ST 2084</span><span class="hidden h-3 w-px bg-line sm:block"></span
        ><span class="hidden sm:block">203 nits diffuse white</span>
      </div>
      <span class="flex items-center gap-2"
        ><app-icon name="chip" class="size-3.5" />Processed on your device</span
      >
    </footer>
  </section>
</main>
