<div class="mb-6 flex items-center justify-between">
  <h2 class="text-base font-semibold tracking-tight">Light controls</h2>
  <button class="quiet-button text-xs" type="button" (click)="resetRequested.emit()">
    <app-icon name="reset" class="size-3.5" />Reset
  </button>
</div>
<div class="space-y-6">
  <app-exposure-controls
    [stops]="settings().stops"
    (stopsChanged)="changed.emit({ stops: $event })"
  />
  <app-glow-mask-controls
    [mode]="settings().mode"
    [threshold]="settings().threshold"
    (changed)="changed.emit($event)"
  />
  <app-output-controls
    [background]="settings().background"
    [preserveTransparency]="settings().preserveTransparency"
    [size]="settings().size"
    (changed)="changed.emit($event)"
  />
</div>
<button
  class="primary-button mt-4 w-full"
  type="button"
  [disabled]="!ready() || busy()"
  (click)="encode.emit()"
>
  <app-icon name="sparkle" class="size-5" />{{ busy() ? 'Encoding…' : 'Encode image' }}
</button>
