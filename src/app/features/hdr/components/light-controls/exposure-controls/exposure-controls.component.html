<div>
  <p class="control-label">Preset</p>
  <div class="segments" role="group" aria-label="Exposure preset">
    @for (preset of presets; track preset.stops) {
      <button
        type="button"
        [attr.aria-pressed]="stops() === preset.stops"
        (click)="stopsChanged.emit(preset.stops)"
      >
        {{ preset.label }}
      </button>
    }
  </div>
</div>
<div>
  <label class="control-label" for="boost"
    >Highlight boost
    <output class="mono text-foreground"
      >+{{ stops().toFixed(1) }} <span class="text-muted">stops</span></output
    ></label
  >
  <input
    id="boost"
    type="range"
    min="0"
    max="4"
    step="0.1"
    [value]="stops()"
    [style.--fill]="(stops() / 4) * 100 + '%'"
    (input)="stopsChanged.emit(number($event))"
  />
  <div class="mt-4 text-3xl font-medium tracking-tight">
    {{ peak() | number }} <span class="text-lg font-normal text-muted">nits</span>
  </div>
  <div class="relative mt-4 mb-9 h-3 luminance-ruler" aria-hidden="true">
    @for (tick of ticks; track tick) {
      <span class="ruler-label" [style.left.%]="position(tick)">{{
        tick >= 1000 ? tick / 1000 + 'k' : tick
      }}</span>
    }
    <span class="absolute -top-1 h-5 w-px bg-accent" [style.left.%]="position(peak())"></span>
  </div>
</div>
