<button
  #trigger
  type="button"
  class="dropdown-trigger"
  [id]="controlId()"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="listId()"
  [attr.aria-activedescendant]="
    open() && activeIndex() >= 0 ? controlId() + '-option-' + activeIndex() : null
  "
  [attr.popovertarget]="listId()"
  [disabled]="disabled()"
  (keydown)="keydown($event)"
>
  @if (selected()?.swatch; as swatch) {
    <span class="dropdown-trigger-swatch" [style.background]="swatch" aria-hidden="true"></span>
  }
  <span class="dropdown-value">{{ selected()?.label || placeholder() }}</span>
  <svg class="dropdown-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <path
      d="m4 6 4 4 4-4"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>

<div
  #panel
  [id]="listId()"
  class="dropdown-panel"
  [class.dropdown-cards]="variant() === 'cards'"
  popover="auto"
  role="listbox"
  [attr.aria-label]="label()"
  (beforetoggle)="beforeToggle($event)"
>
  @for (option of options(); track option.value; let index = $index) {
    <button
      type="button"
      role="option"
      tabindex="-1"
      class="dropdown-option"
      [id]="controlId() + '-option-' + index"
      [attr.aria-selected]="option.value === value()"
      [attr.aria-disabled]="option.disabled || null"
      [class.dropdown-active]="activeIndex() === index"
      [disabled]="option.disabled"
      (pointerdown)="pointerdown($event)"
      (pointermove)="hover(index)"
      (click)="choose(index)"
    >
      @if (option.swatch) {
        <span
          class="dropdown-option-swatch"
          [style.background]="option.swatch"
          aria-hidden="true"
        ></span>
      }
      <span class="dropdown-option-copy">
        <span class="dropdown-option-name">{{ option.label }}</span>
        @if (option.description) {
          <span class="dropdown-option-description">{{ option.description }}</span>
        }
      </span>
      <svg class="dropdown-check" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path
          d="m3.5 8 3 3 6-6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  }
</div>
