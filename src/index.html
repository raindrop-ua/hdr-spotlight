<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spotlight — HDR image studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Create PQ-encoded BT.2020 HDR images from PNG, JPEG, WebP, or SVG artwork directly in your browser. Your files never leave your device."
    />
    <meta
      name="keywords"
      content="HDR image encoder, PQ image, BT.2020, Rec. 2020, HDR image converter, PNG HDR, JPEG HDR"
    />
    <meta name="author" content="Spotlight" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f5f5ef" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved choice before first paint; keep in sync with ThemeService.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('spotlight.theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        document.documentElement.dataset.theme = preference;
        const dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#191b18' : '#f5f5ef';
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spotlight" />
    <meta property="og:url" content="https://hdrspotlight.com/" />
    <meta property="og:title" content="Spotlight — HDR image studio" />
    <meta
      property="og:description"
      content="Create PQ-encoded BT.2020 HDR images locally in your browser. No uploads, no server processing."
    />
    <meta property="og:image" content="https://hdrspotlight.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HDR Spotlight — make your images shine in HDR" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spotlight — HDR image studio" />
    <meta
      name="twitter:description"

    />

    <link rel="canonical" href="https://hdrspotlight.com/" />
    <link rel="icon" sizes="48x48" href="/favicon.ico" />
